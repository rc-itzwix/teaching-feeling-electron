name: Build iOS IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/ || true
          cp main.js www/ || true
          cp lang.js www/ || true
          cp -r tyrano www/ || true
          cp -r res www/ || true
          cp -r data www/ || true

      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios --save-dev

      - name: Initialize iOS Platform & Fix Podfile
        run: |
          npx cap add ios || true
          sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '17.0'/g" ios/App/Podfile
          pod install --project-directory=ios/App

      - name: Compile IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          mkdir Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r Game.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TeachingFeeling-IPA
          path: Game.ipa
